[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aldenv"
dynamic = ["version"]
description = "Environments to explore the integration of AI agents and ML algorithms with ALD tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Angel Yanguas-Gil" }]
dependencies = ["numpy"]
keywords = ["atomic layer deposition", "ALD", "AI", "environments"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest"]
examples = ["matplotlib"]
# The docs are built with Zensical, which reads mkdocs.yml natively. The
# config stays MkDocs-compatible, so `pip install mkdocs mkdocs-material`
# also still builds it.
docs = ["zensical", "pymdown-extensions"]

# The version lives in src/aldenv/__init__.py, so `aldenv.__version__` and the
# package metadata can never disagree. Bump it there when cutting a release.
[tool.hatch.version]
path = "src/aldenv/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aldenv"]
