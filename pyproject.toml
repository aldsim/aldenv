[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aldenv"
version = "0.0.1"
description = "Environments for exploring AI agents for semiconductor processing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "anglyan" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
examples = ["matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/aldenv"]
